<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamguage selection</title>
  </head>
  <body>
    <h1>Are you not italian?</h1>
    <p>Select your language here.</p>
    <label for="language-select">
      Seleziona la tua lingua / Select your language:
    </label>
    <select id="language-select" onchange="if (this.value) window.location.href = this.value;">
      <option value="" selected disabled>-- Scegli / Choose --</option>
      <option value="index.html">Italiano</option>
      <option value="internazionale/en/index.html">English</option>
      <option value="internazionale/es/index.html">Español</option>
      <option value="internazionale/fr/index.html">Français</option>
      <option value="internazionale/de/index.html">Deutsch</option>
      <option value="internazionale/ro/index.html">Română</option>
      <option value="internazionale/ar/index.html">العربية (Arabo)</option>
      <option value="internazionale/zh/index.html">中文 (Cinese)</option>
      <option value="internazionale/sq/index.html">Shqip</option>
      <option value="internazionale/uk/index.html">Українська</option>
    </select>
  </body>
</html>
